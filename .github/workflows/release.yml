name: Auto Release Extension

on:
  push:
    branches: [main]
    paths:
      - 'manifest.json'
      - 'background.js'
      - 'offscreen.html'
      - 'offscreen.js'
      - 'pcm-processor.js'
      - 'content.js'
      - 'popup.html'
      - 'popup.css'
      - 'popup.js'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Package & Publish GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate syntax & read version from manifest.json
        run: |
          node --check background.js
          node --check offscreen.js
          node --check pcm-processor.js
          node --check content.js
          node --check popup.js
          VERSION=$(node -e "const m = JSON.parse(require('fs').readFileSync('manifest.json', 'utf8')); if (!m.version) process.exit(1); console.log(m.version);")
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG=v$VERSION" >> "$GITHUB_ENV"

      - name: Check whether release already exists
        id: check_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build clean Chrome Extension ZIP
        if: steps.check_release.outputs.exists == 'false' || github.event_name == 'workflow_dispatch'
        run: |
          mkdir -p dist
          zip -r "dist/SlicexPackSaver-${TAG}.zip" \
            manifest.json \
            background.js \
            offscreen.html \
            offscreen.js \
            pcm-processor.js \
            content.js \
            popup.html \
            popup.css \
            popup.js

      - name: Create GitHub Release
        if: steps.check_release.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$TAG" "dist/SlicexPackSaver-${TAG}.zip" \
            --title "SlicexPackSaver ${TAG}" \
            --generate-notes

      - name: Refresh ZIP on manual dispatch (existing release)
        if: steps.check_release.outputs.exists == 'true' && github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$TAG" "dist/SlicexPackSaver-${TAG}.zip" --clobber
